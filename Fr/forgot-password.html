```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SkillBridge</title>
    <link rel="stylesheet" href="/assets/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>Reset Password</h1>

        <p class="subtitle">
            Enter your registered email to recover your SkillBridge account.
        </p>

        <form id="resetForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="button" id="sendOtpBtn">
                Send OTP
            </button>

            <label for="otp">Email OTP</label>
            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter OTP"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <p id="message" role="status"></p>

        <a class="back-link" href="/">← Back to Login</a>
    </main>

    <script src="/assets/forgot-password.js"></script>
</body>
</html>
```
