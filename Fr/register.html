<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SkillBridge</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <section class="section active">
        <div class="card">
            <h1>🚀 Join SkillBridge</h1>
            <p>Create your account to get started.</p>

            <form id="registerForm">
                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    maxlength="100"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create Password (minimum 8 characters)"
                    minlength="8"
                    required
                >

                <button type="submit" id="sendOtpBtn">
                    Send OTP
                </button>
            </form>

            <form id="verifyOtpForm" hidden>
                <p>Enter the 6-digit OTP sent to your email.</p>

                <input
                    type="text"
                    id="registerOTP"
                    placeholder="Enter 6-digit OTP"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    autocomplete="one-time-code"
                    required
                >

                <button type="submit" id="verifyOtpBtn">
                    Verify OTP & Create Account
                </button>

                <button type="button" id="resendOtpBtn">
                    Resend OTP
                </button>
            </form>

            <p id="registerMessage" role="status" aria-live="polite"></p>

            <p>Already have an account?
                <a href="/">Login here</a>
            </p>
        </div>
    </section>

    <script src="/assets/register.js"></script>
</body>
</html>
